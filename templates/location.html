<!DOCTYPE html>
<html>
<head>
<title>Live Location</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#111;
    color:white;
    text-align:center;
}
.header{
    background:#ff6600;
    padding:15px;
    font-size:22px;
    font-weight:bold;
}
.box{
    padding:12px;
}
button{
    padding:12px 20px;
    border:0;
    border-radius:8px;
    background:#00c853;
    color:white;
    font-size:16px;
}
#map{
    width:100%;
    height:520px;
}
</style>
</head>

<body>

<div class="header">Live Location Tracker</div>

<div class="box">
    <button id="shareBtn" onclick="startSharing()">Start Sharing My Location</button>
    <p id="status">Waiting...</p>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
let urlParams = new URLSearchParams(window.location.search);
let mode = urlParams.get("mode");

let map = L.map("map").setView([13.0827, 80.2707], 13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19
}).addTo(map);

let marker = null;

function setMapLocation(lat, lng){
    if(marker === null){
        marker = L.marker([lat, lng]).addTo(map);
        map.setView([lat, lng], 17);
    }else{
        marker.setLatLng([lat, lng]);
        map.panTo([lat, lng]);
    }
}

function startSharing(){
    if(!navigator.geolocation){
        alert("Location not supported");
        return;
    }

    navigator.geolocation.watchPosition(function(pos){
        let lat = pos.coords.latitude;
        let lng = pos.coords.longitude;

        document.getElementById("status").innerHTML =
        "Sharing: " + lat + ", " + lng;

        setMapLocation(lat, lng);

        fetch("/update-location", {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                lat:lat,
                lng:lng
            })
        });

    }, function(){
        alert("Location permission denied");
    }, {
        enableHighAccuracy:true,
        maximumAge:0,
        timeout:10000
    });
}

function viewLocation(){
    fetch("/get-location")
    .then(res => res.json())
    .then(data => {
        if(data.lat && data.lng){
            document.getElementById("status").innerHTML =
            "Viewing: " + data.lat + ", " + data.lng;

            setMapLocation(data.lat, data.lng);
        }else{
            document.getElementById("status").innerHTML =
            "Location not shared yet.";
        }
    });
}

if(mode === "view"){
    document.getElementById("shareBtn").style.display = "none";
    setInterval(viewLocation, 3000);
    viewLocation();
}
</script>

</body>
</html>
