<!DOCTYPE html>
<html>
<head>
<title>Live Location</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:Arial;
    background:#111;
    color:white;
    text-align:center;
}
.header{
    background:#ff6600;
    padding:15px;
    font-size:22px;
    font-weight:bold;
}
.box{
    padding:15px;
}
button{
    padding:12px 20px;
    border:0;
    border-radius:8px;
    background:#00c853;
    color:white;
    font-size:16px;
}
iframe{
    width:100%;
    height:500px;
    border:0;
}
</style>
</head>

<body>

<div class="header">Live Location Tracker</div>

<div class="box">
    <button onclick="startSharing()">Start Sharing My Location</button>
    <p id="status">Open this page on your mobile and allow location.</p>
</div>

<iframe id="map"></iframe>

<script>
let urlParams = new URLSearchParams(window.location.search);
let mode = urlParams.get("mode");

function startSharing(){
    if(!navigator.geolocation){
        alert("Location not supported");
        return;
    }

    navigator.geolocation.watchPosition(function(pos){
        let lat = pos.coords.latitude;
        let lng = pos.coords.longitude;

        document.getElementById("status").innerHTML =
        "Sharing live location: " + lat + ", " + lng;

        document.getElementById("map").src =
        "https://maps.google.com/maps?q=" + lat + "," + lng + "&z=17&output=embed";

        fetch("/update-location", {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                lat:lat,
                lng:lng
            })
        });

    }, function(){
        alert("Location permission denied");
    }, {
        enableHighAccuracy:true
    });
}

function viewLocation(){
    fetch("/get-location")
    .then(res => res.json())
    .then(data => {
        if(data.lat && data.lng){
            document.getElementById("status").innerHTML =
            "Viewing live location: " + data.lat + ", " + data.lng;

            document.getElementById("map").src =
            "https://maps.google.com/maps?q=" + data.lat + "," + data.lng + "&z=17&output=embed";
        }else{
            document.getElementById("status").innerHTML =
            "Location not shared yet.";
        }
    });
}

if(mode === "view"){
    document.querySelector("button").style.display = "none";
    setInterval(viewLocation, 3000);
    viewLocation();
}
</script>

</body>
</html>
