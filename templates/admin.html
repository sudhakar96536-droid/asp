<!DOCTYPE html>
<html>
<head>
<title>Admin Live Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
    margin:0;
    font-family:Arial;
}
#map{
    width:100%;
    height:100vh;
}
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
let map = L.map("map").setView([13.0827, 80.2707], 12);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom:19
}).addTo(map);

let markers = {};

function loadEmployees(){
    fetch("/admin/verified")
    .then(res => res.json())
    .then(data => {

        Object.keys(data).forEach(empId => {
            let emp = data[empId];

            if(emp.lat && emp.lng){

                let lat = emp.lat;
                let lng = emp.lng;

                if(!markers[empId]){
                    markers[empId] = L.marker([lat, lng]).addTo(map);

                    markers[empId].bindTooltip(emp.name, {
                        permanent:true,
                        direction:"top"
                    });

                    map.setView([lat, lng], 15);
                }else{
                    markers[empId].setLatLng([lat, lng]);
                }
            }
        });
    });
}

setInterval(loadEmployees, 3000);
loadEmployees();
</script>

</body>
</html>
